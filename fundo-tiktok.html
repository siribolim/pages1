<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Siribolim • Fundo TikTok</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0714}#stage{position:absolute;width:1080px;height:1920px;transform-origin:top left;overflow:hidden;background:radial-gradient(ellipse at 85% 15%,#682c8c66,transparent 45%),radial-gradient(ellipse at 5% 85%,#7433b955,transparent 46%),linear-gradient(140deg,#0e081b,#251038 55%,#10091d);background-size:130% 130%,130% 130%,160% 160%;animation:drift 28s ease-in-out infinite}.grid{position:absolute;inset:0;background:linear-gradient(#ba8be606 1px,transparent 1px),linear-gradient(90deg,#ba8be606 1px,transparent 1px);background-size:90px 90px;mask-image:linear-gradient(transparent,#0005,transparent)}.orb{position:absolute;right:-230px;top:200px;width:740px;height:740px;border-radius:50%;border:1px solid #cc96ff17;box-shadow:0 0 80px #9b47dd0d,inset 0 0 80px #9b47dd0d;animation:orbit 38s ease-in-out infinite}.orb.second{width:1000px;height:1000px;right:auto;left:-550px;top:auto;bottom:40px;animation-direction:reverse}.band{position:absolute;left:-50%;top:25%;width:200%;height:140px;background:linear-gradient(transparent,#9c51d90a,transparent);filter:blur(25px);transform:rotate(-25deg);animation:sweep 24s ease-in-out infinite}.dust{position:absolute;border-radius:100%;background:#dec3ff;box-shadow:0 0 9px #c18bf4;opacity:0;animation:dust var(--t) linear infinite;animation-delay:var(--delay)}.haze{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,#07040c66)}@keyframes drift{50%{background-position:100% 30%,50% 100%,100% 50%}}@keyframes dust{0%{transform:translate(0,50px);opacity:0}20%,70%{opacity:.4}100%{transform:translate(55px,-240px);opacity:0}}@keyframes orbit{50%{transform:translate(35px,75px) scale(1.07)}}@keyframes sweep{50%{transform:translateY(180px) rotate(-25deg);opacity:.4}}
</style><div id="stage"><div class="grid"></div><div class="orb"></div><div class="orb second"></div><div class="band"></div><div class="haze"></div></div><script>const stage=document.querySelector('#stage');for(let i=0;i<48;i++){let e=document.createElement('i');e.className='dust';e.style.cssText='left:'+((i*173)%1080)+'px;top:'+((i*277)%1920)+'px;width:'+(1+i%3)+'px;height:'+(1+i%3)+'px;--t:'+(13+i%12)+'s;--delay:-'+(i*1.17)+'s';stage.append(e)}function fit(){let s=Math.max(innerWidth/1080,innerHeight/1920);stage.style.transform='scale('+s+')';stage.style.left=(innerWidth-1080*s)/2+'px';stage.style.top=(innerHeight-1920*s)/2+'px'}addEventListener('resize',fit);fit();</script></html>
