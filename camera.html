<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Siribolim • Câmera 16:9</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#stage{position:absolute;width:1960px;height:1120px;transform-origin:top left;font-family:Arial;color:white}.rim{position:absolute;inset:8px;border-radius:42px;border:12px solid #8049ba;box-shadow:0 0 18px #ac63f866,inset 0 0 12px #ac63f866}.edge{position:absolute;inset:8px;border-radius:42px;padding:12px;background:linear-gradient(var(--angle),#5b2d84 0%,#9054c6 32%,#b983f0 43%,#f3dcff 48%,#9b5ed4 53%,#6a349c 72%);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;animation:run 12s linear infinite}.accent{position:absolute;left:44px;top:8px;width:210px;height:9px;background:#e9caff;box-shadow:0 0 13px #c486ff;border-radius:8px}.accent.end{left:auto;top:auto;right:44px;bottom:8px}.badge{position:absolute;right:50px;top:31px;padding:13px 19px;display:flex;align-items:center;gap:11px;background:#160f20;border:1px solid #70489a;border-radius:7px;font-size:22px;font-weight:700;letter-spacing:3px}.badge i{width:11px;height:11px;background:#ff3a55;border-radius:50%;box-shadow:0 0 15px #ff3a55;animation:pulse 2.5s ease-in-out infinite}.tag{position:absolute;bottom:1px;left:62px;padding:4px 18px;background:#21132d;border:1px solid #744496;border-radius:6px;font-size:22px;font-weight:bold;letter-spacing:2px}.preview{background:repeating-conic-gradient(#17121f 0% 25%,#20192a 0% 50%) 0/32px 32px}.preview .sample{display:flex}.sample{position:absolute;left:20px;top:20px;width:1920px;height:1080px;border-radius:31px;display:none;align-items:center;justify-content:center;color:#7b638d;font-size:36px;letter-spacing:6px}@property --angle{syntax:'<angle>';initial-value:0deg;inherits:false}@keyframes run{to{--angle:360deg}}@keyframes pulse{50%{opacity:.55;box-shadow:0 0 18px #ff3a55}}

/* Identificação legível mesmo com a webcam reduzida */
.badge{right:44px;top:28px;padding:21px 26px;gap:18px;background:linear-gradient(115deg,#330e21,#1a0c1b 75%);border:2px solid #ff59767a;border-radius:13px;font-size:42px;letter-spacing:3px;font-weight:900;box-shadow:0 6px 20px #0005,inset 0 1px #ffb3c026;isolation:isolate;overflow:hidden;animation:badge-glow 4s ease-in-out infinite}
.badge:before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 36%,#ffa3b21b 50%,transparent 64%);transform:translateX(-120%);animation:badge-shine 8s ease-in-out infinite;z-index:-1}
.badge i{flex-shrink:0;width:19px;height:19px;background:#ff405b;box-shadow:0 0 14px #ff405b;animation:live-pulse 2.5s ease-in-out infinite}
.signal{display:flex;align-items:center;gap:5px;height:31px;margin-left:3px}.signal b{display:block;width:5px;height:14px;background:#ff8ea2;border-radius:3px;animation:signal 1.8s ease-in-out infinite;transform-origin:center}.signal b:nth-child(2){height:27px;animation-delay:.25s}.signal b:nth-child(3){height:20px;animation-delay:.5s}
.tag{left:60px;bottom:2px;padding:15px 29px 18px;background:linear-gradient(120deg,#1b1028,#39154e);border:2px solid #b77de0aa;border-radius:13px;font-size:54px;font-weight:900;letter-spacing:1px;line-height:1.1;box-shadow:0 -4px 20px #b467e522,inset 0 1px #ecc4ff22;overflow:hidden}
.tag-name{display:inline-block;background:linear-gradient(110deg,#fff 26%,#e9c8ff 38%,#fff 46%,#c18aff 52%,#fff 65%);background-size:300% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:tag-shine 6s ease-in-out infinite;filter:drop-shadow(0 2px 0 #452259)}
.tag:after{content:'';position:absolute;bottom:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,#c17cff,#f0d6ff,transparent);background-size:200% 100%;animation:tag-line 6s ease-in-out infinite}
@keyframes tag-shine{0%,20%{background-position:150% 0}65%,100%{background-position:-50% 0}}
@keyframes tag-line{50%{background-position:100% 0}}
@keyframes live-pulse{0%,100%{box-shadow:0 0 14px #ff405b,0 0 0 0 #ff405b55}60%{box-shadow:0 0 20px #ff405b,0 0 0 12px #ff405b00}}
@keyframes signal{50%{transform:scaleY(.45);opacity:.65}}
@keyframes badge-glow{50%{border-color:#ff7897b0;box-shadow:0 0 24px #f53c6022,inset 0 1px #ffb3c026}}
@keyframes badge-shine{0%,35%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}

/* Acabamento da câmera: luz em movimento e assinatura central */
.edge{background:linear-gradient(var(--angle),#4c206d,#aa60e0 32%,#d8a6ff 48%,#713c9b 65%,#4c206d);animation:run 18s linear infinite}
.border-runners{position:absolute;inset:0;width:1960px;height:1120px;overflow:visible;pointer-events:none}.runner{fill:none;stroke-linecap:round;stroke-width:10;stroke-dasharray:105 895;animation:border-lap 10s linear infinite}.runner-a{stroke:#f2d5ff;filter:drop-shadow(0 0 9px #d09aff)}.runner-b{stroke:#b57bff;stroke-dasharray:180 820;animation-delay:-5s;filter:drop-shadow(0 0 12px #a858ff)}
.badge{right:43px;top:33px;padding:18px 27px;gap:18px;background:linear-gradient(110deg,#25111d,#120b16);border:1.5px solid #ea6c8966;border-radius:50px;font-size:43px;line-height:1.1;font-weight:800;letter-spacing:2px;box-shadow:0 5px 18px #0005;animation:none;overflow:visible}
.badge:before{display:none}.badge span{color:#fff4f6;text-shadow:none}.badge i{width:17px;height:17px;background:#ff4059;border:3px solid #ff8a9b;box-shadow:0 0 12px #ff345866;position:relative;animation:none}.badge i:after{content:'';position:absolute;inset:-8px;border:2px solid #ff6b86;border-radius:50%;animation:live-ring 2.8s ease-out infinite}
.tag{left:50%;bottom:0;transform:translateX(-50%);padding:12px 49px 18px;border:2px solid #c990fca0;border-bottom:0;border-radius:20px 20px 0 0;background:linear-gradient(115deg,#170e23,#351245 50%,#170e23);font-size:82px;line-height:1.1;letter-spacing:1px;font-weight:900;box-shadow:0 -5px 26px #b35cff44,inset 0 1px #f7d6ff38;overflow:hidden}
.tag-name{background:linear-gradient(110deg,#fff 24%,#deb5ff 37%,#fff 45%,#b46cf5 51%,#fff 64%);background-size:320% 100%;background-clip:text;-webkit-background-clip:text;animation:tag-shine 5s ease-in-out infinite;filter:drop-shadow(0 3px 0 #47225e)}
.tag:before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,#d494ff16 50%,transparent 60%);transform:translateX(-120%);animation:badge-shine 7s ease-in-out infinite;pointer-events:none}.tag:after{height:4px;top:0;bottom:auto;background:linear-gradient(90deg,transparent,#c07bff,#f6e5ff,#c07bff,transparent);animation:tag-line 4s ease-in-out infinite}
@keyframes border-lap{to{stroke-dashoffset:-1000}}@keyframes live-ring{0%{transform:scale(.75);opacity:.8}80%,100%{transform:scale(1.65);opacity:0}}

/* Assinatura menor, reflexo violeta mais visível */
.tag{font-size:70px;padding:11px 41px 16px}.tag-name{background:linear-gradient(110deg,#f8efff 24%,#e0bbff 34%,#a94eff 43%,#d399ff 48%,#ae5aff 53%,#f8efff 64%);background-size:320% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:violet-name 4.8s ease-in-out infinite;filter:drop-shadow(0 2px 0 #412153) drop-shadow(0 0 5px #a75af52b)}
@keyframes violet-name{0%,15%{background-position:150% 0}75%,100%{background-position:-50% 0}}

/* Borda minimalista: base discreta e um ponto de luz */
.rim{border-color:#70418e;box-shadow:0 0 7px #b577e21c,inset 0 0 5px #b577e218}.edge{background:linear-gradient(115deg,#58316e,#815297 55%,#61367d);animation:none}.runner{stroke-width:5;stroke-dasharray:55 945;animation:border-lap 18s linear infinite}.runner-a{stroke:#d7b1f1;filter:drop-shadow(0 0 4px #c799e977)}.runner-b{display:none}.tag{box-shadow:0 -2px 12px #a366cf1c,inset 0 1px #ead0fa20;border-color:#a16cbf88}.tag:after{height:2px;opacity:.65}

/* Acabamento perolado: luz distribuída pela moldura inteira */
.border-runners{display:none}.rim{border-color:#744696;box-shadow:0 0 11px #aa6ee52a,inset 0 0 8px #aa6ee51c;animation:rim-breathe 9s ease-in-out infinite}
.edge{background:conic-gradient(from var(--angle),#573070 0deg,#7c4b9b 38deg,#bd8fdc 75deg,#e6c9fa 92deg,#a36ec7 125deg,#653782 160deg,#8956a6 202deg,#cda5e5 242deg,#e6c9fa 258deg,#9965bd 294deg,#573070 360deg);animation:pearl-flow 16s linear infinite;filter:drop-shadow(0 0 4px #bd88e33b)}
.edge:after{content:'';position:absolute;inset:0;border-radius:42px;background:linear-gradient(125deg,#efd8ff30,transparent 28%,#b67cdc18 54%,transparent 77%,#efd8ff25);background-size:220% 220%;animation:pearl-reflection 11s ease-in-out infinite}
@keyframes pearl-flow{to{--angle:360deg}}@keyframes pearl-reflection{0%,100%{background-position:0% 0%;opacity:.45}50%{background-position:100% 100%;opacity:.9}}@keyframes rim-breathe{0%,100%{box-shadow:0 0 9px #aa6ee522,inset 0 0 7px #aa6ee518}50%{box-shadow:0 0 17px #b87cf13b,inset 0 0 11px #b87cf12b}}
</style><div id="stage"><div class="sample">SUA CÂMERA / 16:9</div><div class="rim"></div><div class="edge"></div><svg class="border-runners" viewBox="0 0 1960 1120" aria-hidden="true"><rect class="runner runner-a" x="14" y="14" width="1932" height="1092" rx="36" pathLength="1000"/><rect class="runner runner-b" x="14" y="14" width="1932" height="1092" rx="36" pathLength="1000"/></svg><div class="tag"><span class="tag-name">@siribolim</span></div></div><script>const stage=document.querySelector('#stage');if(new URLSearchParams(location.search).has('preview'))document.body.classList.add('preview');function fit(){let s=Math.min(innerWidth/1960,innerHeight/1120);stage.style.transform='scale('+s+')';stage.style.left=(innerWidth-1960*s)/2+'px';stage.style.top=(innerHeight-1120*s)/2+'px'}addEventListener('resize',fit);fit();</script></html>
